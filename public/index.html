codes(){
 const LV={verified:"موثّق",unverified:"غير موثّق بعد",sample:"تجريبي"};
 app.innerHTML=`<h2>أكواد لوحة الاتصال</h2><div class="warn">كل كود موسوم بمستوى توثيقه ومصدره. القائمة قصيرة عمدًا: لا أضيف إلا ما وجدتُ له مصدرًا، ولا أكواد مسح البيانات أو إعادة الضبط لأنها مدمرة وغير موثّقة. لا يوجد كود يعمل على كل الموديلات، وبعضها يظهر قوائم خدمة قد تغيّر إعدادات حساسة.</div>
 <div class="row"><input type="search" id="cq" placeholder="ابحث: 4636، IMEI، تحويل، Sony" aria-label="بحث في الأكواد"><select id="cr" aria-label="الخطورة"><option value="">كل الخطورة</option><option value="low">منخفضة</option><option value="mid">متوسطة</option><option value="high">عالية</option></select><select id="cv" aria-label="التوثيق"><option value="">كل التوثيق</option><option value="verified">موثّق</option><option value="unverified">غير موثّق بعد</option></select></div><div id="co"></div>
 <p class="hint">للتحقق الرسمي من IMEI استخدم مشغّل الاتصال أو الشركة المصنّعة. الإضافات تدخل عبر لوحة الإدارة بعد المراجعة.</p>`;
 const q=document.getElementById("cq"),r=document.getElementById("cr"),v2=document.getElementById("cv"),o=document.getElementById("co");
 const draw=()=>{const t=q.value.trim().toLowerCase();
  const L=DB.codes.filter(c=>(!r.value||c.risk===r.value)&&(!v2.value||(c.level||c.confidence)===v2.value)&&(!t||(c.code+" "+c.purpose+" "+(c.cat||"")+" "+(c.compat||"")).toLowerCase().includes(t)));
  o.innerHTML=L.map(c=>{const lvl=c.level||"unverified";return `<div class="card"><div class="row"><code style="font-size:18px">${esc(c.code)}</code><button class="g cpc" data-c="${esc(c.code)}">نسخ</button><span class="badge ${c.risk}">خطورة ${RS[c.risk]}</span><span class="badge ${lvl==="verified"?"low":"nt"}">${LV[lvl]||esc(lvl)}</span>${c.cat?`<span class="badge nt">${esc(c.cat)}</span>`:""}</div>

  <p class="hint">المصادر: ${c.srcText||(c.srcs&&c.srcs.length?c.srcs.map(link).join("، "):"لا مصدر")} · آخر تحقق: ${c.verified||"لم يتم"}</p></div>`}).join("")||`<div class="card">لا نتائج. لم أجد كودًا موثّقًا يطابق بحثك، ولن أخمّن.</div>`;
  o.querySelectorAll(".cpc").forEach(b=>b.onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(b.dataset.c);ok=true}catch(e){}b.textContent=ok?"تم النسخ":"انسخه يدويًا";setTimeout(()=>b.textContent="نسخ",1800)});};
 [q,r,v2].forEach(x=>x.addEventListener("input",draw));draw();

logs(){
 app.innerHTML=`<h2>تحليل السجل</h2><p class="sub">يعمل داخل متصفحك فقط؛ لا يُرسل شيء إلى أي خادم. التحليل بالكلمات المفتاحية وليس ذكاءً اصطناعيًا، والنتائج احتمالات لا أحكام. لا تلصق كلمات مرور أو بيانات شخصية. المحتوى يُعامل كنص غير موثوق ولا يُنفَّذ أبدًا.</p>
 <div class="card"><label>ارفع ملف .txt أو .log (حتى 2 ميغابايت): <input type="file" id="fl" accept=".txt,.log,text/plain"></label><p><textarea id="ta" rows="7" style="width:100%;font:inherit;direction:ltr;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px" placeholder="أو الصق ناتج logcat / dumpsys هنا"></textarea></p><button class="b" id="an">حلّل</button> <span id="er" class="hint" role="alert"></span></div><div id="out"></div>`;
 const R=[[/FATAL EXCEPTION/g,"انهيار تطبيق (FATAL EXCEPTION)","مؤكد في السجل أن تطبيقًا انهار. انظر اسم الحزمة بعد السطر. جرّب مسح كاش التطبيق ثم تحديثه."],[/ANR in /g,"تطبيق لا يستجيب (ANR)","غالبًا ثقل أو تعليق؛ سبب مرجّح لا مؤكد."],[/OutOfMemoryError/g,"نفاد الذاكرة","قد يدل على تطبيق مستهلك للذاكرة."],[/low on storage|No space left on device|ENOSPC/gi,"نقص مساحة التخزين","حرّر مساحة ثم أعد المحاولة."],[/avc:\s+denied/g,"رفض صلاحيات SELinux","شائع في السجلات الطبيعية، ولا يدل وحده على عطل."],[/Kernel panic/gi,"Kernel panic","خطأ نظام خطير؛ تواصل مع الدعم الرسمي ولا تفلّش."],[/UnknownHostException|Unable to resolve host/g,"فشل تحليل اسم النطاق (DNS/اتصال)","راجع الاتصال وإعدادات DNS."],[/SIM.*(absent|not ready)/gi,"حالة SIM غير جاهزة","أعد تركيب الشريحة وجرّبها في جهاز آخر."]];
 const run=txt=>{const out=document.getElementById("out");const found=R.map(r=>[r,(txt.match(r[0])||[]).length]).filter(x=>x[1]);
  out.innerHTML=found.length?found.map(([r,n])=>`<div class="card"><b>${r[1]}</b><span class="badge nt">${n} مرة</span><p>${r[2]}</p></div>`).join(""):`<div class="card">لم تُطابق أي قاعدة مدعومة في هذا النص (${txt.length} حرف). هذا لا يعني عدم وجود عطل، قاعدة الكلمات صغيرة.</div>`};
 const er=document.getElementById("er"),ta=document.getElementById("ta");
 document.getElementById("fl").onchange=e=>{const f=e.target.files[0];er.textContent="";if(!f)return;
  if(!/\.(txt|log)$/i.test(f.name)||(f.type&&!f.type.startsWith("text/"))){er.textContent="نوع الملف غير مدعوم. المسموح: .txt و.log فقط.";e.target.value="";return}
  if(f.size>2097152){er.textContent="الملف أكبر من 2 ميغابايت.";e.target.value="";return}
  const r=new FileReader();r.onload=()=>{ta.value=String(r.result)};r.onerror=()=>{er.textContent="تعذّرت قراءة الملف."};r.readAsText(f)};
 document.getElementById("an").onclick=()=>{const t=ta.value;if(!t.trim()){er.textContent="لا يوجد نص لتحليله.";return}er.textContent="";run(t.slice(0,2000000))};
},
inspect(){
 const ta="style=\"width:100%;font:inherit;direction:ltr;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px\"";
 app.innerHTML=`<h2>مركز الفحص</h2><p class="sub">كل الفحوصات هنا تحلّل نصًا تلصقه أنت، داخل متصفحك فقط. المنصة لا تصل إلى هاتفك ولا تفحصه مباشرة.</p>
 <div class="card"><h3>فحص البطارية من ADB</h3><p class="hint">نفّذ <code>adb shell dumpsys battery</code> على الكمبيوتر والصق الناتج.</p><textarea id="bt" rows="6" ${ta}></textarea><div class="row"><button class="b" id="bb">حلّل البطارية</button></div><div id="bo"></div></div>
 <div class="card"><h3>مقارنة هوية الهاتف</h3><p class="hint">أدخل القيمة من إعدادات الهاتف ومن ADB (<code>adb shell getprop ro.product.model</code> و<code>ro.build.version.release</code>) لنقارن بينهما.</p>

 <div class="card"><h3>التحقق من IMEI</h3><p>اعرض الرقم بالاتصال بـ <code>*#06#</code> أو من إعدادات «حول الهاتف»، وتحقق منه عبر مشغّل الاتصال أو الشركة المصنّعة الرسمية. المنصة لا تصل إلى قواعد بياناتهم ولا تطلب منك إدخال الرقم هنا. لا تنشره علنًا.</p></div>
 <div class="card"><h3>الفحص الأمني</h3><div class="warn">لا يمكن لهذه الصفحة اكتشاف البرمجيات الخبيثة. ما تقدمه قائمة مراجعة يدوية فقط، وليست نتيجة فحص.</div><ul><li>راجع في إعدادات الهاتف التطبيقات التي تطلب صلاحيات لا تحتاجها (الكاميرا، الميكروفون، الرسائل، الموقع).</li><li>احذف تطبيقات لا تعرفها أو ثبّتها من خارج المتجر الرسمي.</li><li>فعّل حماية المتجر الرسمي وحدّث النظام.</li><li>إن ظهرت إعلانات غريبة أو استهلاك غير مبرر أو تطبيقات لم تثبّتها، فكّر في نسخ احتياطي ثم تواصل مع الدعم الرسمي.</li></ul></div>`;
 const P=(t,k)=>{const m=t.match(new RegExp("^\\s*"+k+":\\s*(\\S+)","mi"));return m?m[1]:null};
 document.getElementById("bb").onclick=()=>{const t=document.getElementById("bt").value.slice(0,200000),bo=document.getElementById("bo");
  const L=P(t,"level"),T=P(t,"temperature"),H=P(t,"health"),S=P(t,"status");
  if(!L&&!T&&!H&&!S){bo.innerHTML=`<div class="warn">لم أجد حقول level أو temperature أو health أو status. تأكد من لصق ناتج الأمر كاملًا.</div>`;return}
  const HM={1:"غير معروفة",2:"جيدة",3:"سخونة زائدة",4:"تالفة",5:"جهد زائد",6:"عطل غير محدد",7:"باردة"},SM={1:"غير معروف",2:"يشحن",3:"يفرغ",4:"لا يشحن",5:"ممتلئ"};
  const tc=T&&isFinite(+T)?(+T/10):null,rows=[];
  if(L&&isFinite(+L))rows.push(["مستوى الشحن",esc(L)+"%"]);
  if(tc!==null)rows.push(["الحرارة",tc.toFixed(1)+" °م (النظام يبلغ عنها بعُشر الدرجة)"]);
  if(H)rows.push(["الحالة المبلّغ عنها",HM[H]||"رمز "+esc(H)]);
  if(S)rows.push(["حالة الشحن",SM[S]||"رمز "+esc(S)]);
  let n="";
  if(tc!==null&&tc>=45)n+=`<div class="stop">الحرارة مرتفعة (حد إرشادي تقريبي وليس رسميًا): افصل الشاحن وأوقف الاستخدام الثقيل. إن استمرت فتواصل مع مركز معتمد.</div>`;
  if(H&&H!=="2")n+=`<div class="warn">النظام يبلغ عن حالة غير «جيدة». هذا مؤشر يستحق المراجعة وليس تشخيصًا نهائيًا.</div>`;
  bo.innerHTML=`<table>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>${n}<p class="hint">حد التحليل: هذا الناتج لا يتضمن سعة البطارية الفعلية، فلا أستطيع تقدير «صحة البطارية» منه، وبعض الأجهزة لا تعرض كل الحقول.</p>`};
 document.getElementById("ib").onclick=()=>{const g=i=>document.getElementById(i).value.trim(),nz=s=>s.toLowerCase().replace(/[\s\-_]/g,""),io=document.getElementById("io");
  const out=[["الموديل",g("m1"),g("m2")],["إصدار النظام",g("o1"),g("o2")]].filter(x=>x[1]||x[2]).map(([l,a,b])=>!a||!b?`<li>${l}: أدخلت طرفًا واحدًا فقط فلا مقارنة.</li>`:nz(a)===nz(b)?`<li>${l}: متطابق.</li>`:`<li>${l}: يوجد اختلاف بين «${esc(a)}» و«${esc(b)}». هذا شائع (الاسم التجاري يختلف عن رقم الطراز، أو الأداة تعرض بصيغة أخرى، أو حدث تحديث) ولا يكفي وحده للحكم على شيء.</li>`);
  io.innerHTML=out.length?`<ul>${out.join("")}</ul>`:`<div class="warn">أدخل قيمة واحدة على الأقل.</div>`};

 const Y=[["وضع التشغيل",SERVER.on?("متصل بالخادم"+(SERVER.ai?"، والمساعد الذكي مهيأ":"، والمساعد الذكي غير مهيأ")):"مستقل بلا خادم (لا مساعد ذكي ولا لوحة إدارة)"],["نسخ أوامر ADB، تحليل ناتج dumpsys battery، مقارنة بيانات الهوية، قراءة البيانات عبر طبقة DB منفصلة","يعمل في المتصفح"],["التنقل، البحث في المحتوى الحالي، الفلاتر حسب الخطورة","يعمل"],["التشخيص التدريجي بالقواعد الداخلية","يعمل (محتوى أولي)"],["تحليل السجل بالكلمات المفتاحية مع فحص النوع والحجم","يعمل في المتصفح"],["التقييم مفيد/غير مفيد","يعمل مؤقتًا في الذاكرة فقط"],["مساعد الذكاء الاصطناعي النصي",SERVER.ai?"مهيأ؛ يعتمد نجاحه على صحة مفتاح الخدمة واسم النموذج والاتصال":"غير مهيأ؛ التشخيص المحلي يعمل. تحليل الصور غير مدعوم"],["لوحة الإدارة والمصادقة والمراجعة البشرية",SERVER.on?"الخادم متصل؛ افتح /admin وسجّل الدخول":"غير مفعّلة في الوضع المستقل؛ تحتاج الخادم"],["قاعدة الموديلات والأكواد","موديلات منشورة: "+DB.models.length+"؛ الموثّق: "+DB.models.filter(m=>m.data_level==="verified").length+"؛ الأكواد: "+DB.codes.length],["PWA والعمل دون اتصال", "Service Worker وmanifest متاحان عبر HTTPS؛ التخزين المؤقت يقتصر على غلاف التطبيق"],["تنفيذ ADB/Fastboot","غير ممكن من المتصفح: يلزم برنامج محلي موثوق"],["تحديث المعرفة من المصادر","غير مفعّل: يحتاج خدمة مجدولة وموافقة بشرية قبل النشر"]];
 app.innerHTML=`<h2>حالة الميزات</h2><p class="sub">ما يعمل فعليًا وما ينتظر تكاملًا.</p><table>${Y.map(y=>`<tr><td>${y[0]}</td><td>${y[1]}</td></tr>`).join("")}</table><p class="hint">حالة الخادم لا تثبت سلامة كل ميزة؛ لم يُختبر المحتوى على كل الأجهزة، ولا ينفذ المتصفح أوامر ADB مباشرة.</p>`;
},
admin(){
 app.innerHTML=`<h2>لوحة الإدارة</h2>${SERVER.on?`<p>خادم الإدارة متصل. افتح لوحة الإدارة الآمنة لإدارة المحتوى والمستخدمين ومراجعة الاقتراحات.</p><p><a class="b" href="/admin/">فتح لوحة الإدارة</a></p>`:`<div class="warn">لوحة الإدارة تحتاج تشغيل خادم Node.js وقاعدة البيانات؛ وهي غير متاحة في وضع الصفحة المستقلة.</div>`}<p class="hint">لا تدخل بيانات تسجيل الدخول في صفحات غير نطاق مشروعك، ولا تشارك كلمة المرور أو مفاتيح الخدمة.</p>`;
}};
show((location.hash||"#home").slice(1));
/* ===== وضع الخادم (اختياري): يعمل المشروع بدونه ===== */
function aiPanel(){
 const w=document.getElementById("aiwrap");
 w.innerHTML=`<div class="card"><h3>اسأل المساعد الذكي (اختياري)</h3><div class="warn">سيُرسل ما تكتبه إلى خدمة ذكاء اصطناعي خارجية عبر خادم المنصة. لا تكتب كلمات مرور أو رموز تحقق أو بيانات شخصية. الردود آلية وقد تخطئ.</div>
 <div class="row"><input id="ab" placeholder="الشركة (اختياري)"><input id="am" placeholder="الموديل (اختياري)"><input id="ao" placeholder="إصدار النظام (اختياري)"></div>
 <textarea id="at" rows="4" maxlength="2000" style="width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px" placeholder="صف المشكلة ونتائج ما جربته"></textarea>
 <label class="row"><input type="checkbox" id="ac"> أوافق على إرسال هذا النص إلى خدمة الذكاء الاصطناعي</label>
 <div class="row"><button class="b" id="as">أرسل</button><span id="ae" class="hint" role="status"></span></div><div id="ar" class="card" hidden style="white-space:pre-wrap"></div></div>`;
 document.getElementById("as").onclick=async()=>{const e=document.getElementById("ae"),r=document.getElementById("ar");e.textContent="جارٍ الإرسال...";r.hidden=true;
  try{const x=await fetch("/api/assistant",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:document.getElementById("at").value,brand:document.getElementById("ab").value,model:document.getElementById("am").value,os:document.getElementById("ao").value,consent:document.getElementById("ac").checked})});
   const d=await x.json();if(!x.ok){e.textContent=d.error||"تعذّر الطلب";return}
   e.textContent=d.note||"";r.textContent=d.answer;r.hidden=false;}catch(_){e.textContent="تعذّر الاتصال بالخادم. التشخيص المحلي ما زال متاحًا."}};
}
(async()=>{
 if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("/sw.js").catch(()=>{});
 try{
  const h=await fetch("/api/health");if(!h.ok)return;const hj=await h.json();SERVER.on=true;SERVER.ai=!!hj.ai;
  const d=await (await fetch("/api/data")).json();
  const lv={sample:"بيانات تجريبية",unverified:"غير موثّق بعد",verified:"موثّق"};
  const srcs=Object.fromEntries((d.sources||[]).map(x=>[String(x.id),x]));
  DB.brands=(d.brands||[]).map(x=>x.name).filter(Boolean);
  DB.models=(d.models||[]);
  DB.codes=(d.codes||[]).map(c=>({code:c.code,purpose:c.purpose,cat:c.category,out:c.expected_output,note:c.notes,level:c.data_level,compat:c.compat||"غير محدد",risk:RS[c.risk]?c.risk:"mid",verified:c.last_verified,
   srcText:esc(lv[c.data_level]||c.data_level)+(c.source_ids?" · "+c.source_ids.split(",").map(i=>srcs[i]?link2(srcs[i]):"").filter(Boolean).join("، "):"")}));
  // عند وجود الخادم تصبح قاعدة البيانات هي مصدر الحقيقة لجميع الأقسام الديناميكية.
  CMD.splice(0,CMD.length,...(d.commands||[]).map(c=>({c:c.command,d:c.purpose,risk:RS[c.risk]?c.risk:"mid",out:c.expected_output||"لا توجد نتيجة متوقعة مسجلة.",src:(c.command||"").startsWith("fastboot")?"pt":"adb",requirements:c.requirements,compat:c.compat,notes:c.notes})));
  const categoryOf=x=>{const z=((x.title||"")+" "+(x.symptoms||"")).toLowerCase();return /بطاري|حرار|شحن/.test(z)?"battery":/شبك|wi.?fi|اتصال|بيانات الجوال/.test(z)?"network":/تحديث|update/.test(z)?"update":/شعار|إقلاع|إقلاع|reboot|bootloop/.test(z)?"boot":/حساب|قفل|استرداد/.test(z)?"account":/صور|ملفات|محذوف|استعادة بيانات/.test(z)?"data":"apps"};
  KB.splice(0,KB.length,...(d.issues||[]).map(x=>({id:String(x.id),t:x.title,cat:categoryOf(x),risk:RS[x.risk]?x.risk:"mid",loss:"راجع التحذير قبل أي خطوة قد تمس البيانات",sym:x.symptoms||"",tools:"راجع تعليمات الشركة الرسمية",pc:"قد يلزم",steps:String(x.steps||"").split(/\s*\d+[.)]\s*/).map(y=>y.trim()).filter(Boolean),stop:x.stop_when||"توقف إذا كان هناك خطر على البيانات أو سلامة الجهاز.",src:[],brand:x.brand,os_versions:x.os_versions,data_level:x.data_level})));
  if(SERVER.ai)aiPanel();
  show((location.hash||"#home").slice(1));
 }catch(_){/* لا خادم: نبقى في الوضع المستقل */}
})();
function link2(s){return /^https:\/\//.test(s.url)?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`:""}

</script>
